name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

# новый пуш в ту же ветку отменяет ещё не закончившийся прогон
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew :backend:test