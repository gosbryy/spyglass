name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

# новый пуш в ту же ветку отменяет ещё не закончившийся прогон
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    runs-on: ubuntu-latest
    # значения совпадают с дефолтами из application.yaml
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: spyglass
          POSTGRES_USER: spyglass
          POSTGRES_PASSWORD: spyglass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spyglass"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew test

  # отдельной задачей: стиль и тесты проверяются параллельно и падают независимо
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew ktlintCheck
