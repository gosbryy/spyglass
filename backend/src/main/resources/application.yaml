ktor:
  deployment:
    port: 8080
  application:
    modules:
      - gosbry.SerializationKt.configureSerialization
      - gosbry.DatabaseKt.configureDatabase
      - gosbry.StatusPagesKt.configureStatusPages
      - gosbry.RoutingKt.configureRouting
spyglass:
  upload:
    # максимальный размер загружаемого лога (5 МБ)
    maxFileSize: 5242880
  db:
    url: "$DB_URL:jdbc:postgresql://localhost:5432/spyglass"
    user: "$DB_USER:spyglass"
    password: "$DB_PASSWORD:spyglass"
